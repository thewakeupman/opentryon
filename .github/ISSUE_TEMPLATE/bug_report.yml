name: Bug report
description: Report a reproducible problem in OpenTryOn
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Provide the shortest reproducible sequence. Do not attach private photos or secrets.
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and version
      placeholder: fashn, remote or space; commit SHA or release
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, browser, GPU and CUDA versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove API keys, URLs with credentials and personal images.
      render: shell
