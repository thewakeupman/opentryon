[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opentryon"
version = "0.1.0"
description = "An open-source, model-swappable virtual try-on studio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
keywords = ["virtual-try-on", "computer-vision", "fastapi", "fashion", "generative-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1", "pillow>=11.1,<13",
  "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "numpy>=1.26,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]
inference = ["fashn-vton @ git+https://github.com/fashn-AI/fashn-vton-1.5.git@7c0f10af3f91ad4048fe9729c470a13ef905d25a"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
